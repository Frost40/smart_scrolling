<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartScrolling · Content pipeline</title>
<style>
:root{color-scheme:light dark;--bg:#f5f7f8;--panel:#fff;--fg:#172b36;--muted:#526775;--line:#b9c8cf;--accent:#14624f;--on:#fff;--error:#a02228}
@media(prefers-color-scheme:dark){:root{--bg:#111b22;--panel:#1b2932;--fg:#ecf3f5;--muted:#b1c3ce;--line:#526775;--accent:#91d9bc;--on:#102b22;--error:#ffb0b4}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif}header,main,nav{max-width:1180px;margin:auto;padding:20px 28px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:28px;line-height:1.2;margin:4px 0}h2{font-size:23px}h3{margin-top:0}p{margin:8px 0;color:var(--muted)}.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase}nav{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line)}button,input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px 12px;min-height:44px}button{cursor:pointer}button:hover,nav button[aria-selected=true]{border-color:var(--accent);color:var(--accent)}button.primary{background:var(--accent);color:var(--on)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}label{display:flex;flex-direction:column;gap:4px;color:var(--muted);margin:8px 0}input,select{max-width:100%}textarea{width:100%;min-height:120px;font-family:ui-monospace,monospace}input[type=checkbox]{width:24px;min-height:24px;accent-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}.stat{font-size:32px;font-weight:650;color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}#message{position:sticky;top:0;z-index:1;background:var(--panel);padding:12px 28px;border-bottom:1px solid var(--line)}#message:empty{display:none}.error{color:var(--error)}.subtle{color:var(--muted)}details{margin:16px 0}summary{cursor:pointer;min-height:44px;padding:8px 0}.cardtext{white-space:pre-wrap;overflow-wrap:anywhere}small{color:var(--muted)}@media(max-width:600px){header,main,nav{padding:16px}header{align-items:start;flex-direction:column}h1{font-size:25px}.panel{padding:16px}}
</style>
<header><div><div class="eyebrow">SmartScrolling / Back office</div><h1>Content pipeline</h1><p>Make, review and publish learning cards.</p></div><button id="refresh">Refresh</button></header>
<div id="message" role="status" aria-live="polite"></div>
<nav aria-label="Pipeline pages" role="tablist"></nav>
<main id="content" tabindex="-1"></main>
<script>
'use strict';
const token='__TOKEN__', pages=['Overview','Schedule','Providers','Roles','Books','Sources','Jobs','Review','Usage','Log'];
let page=location.hash.slice(1)||'Overview', config={}, status={};
const $=s=>document.querySelector(s), root=$('#content');
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function message(text,error=false){$('#message').textContent=text;$('#message').className=error?'error':''}
async function api(path,data){const response=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json','X-Pipeline-Token':token},body:data===undefined?undefined:JSON.stringify(data)});const value=await response.json();if(!response.ok)throw Error(value.error||response.statusText);return value}
function button(text,fn,primary=false){const b=node('button',text,primary?'primary':'');b.onclick=async()=>{b.disabled=true;try{await fn()}catch(e){message(e.message,true)}finally{b.disabled=false}};return b}
function panel(title,parent=root){const box=node('section',undefined,'panel');box.append(node('h3',title));parent.append(box);return box}
function actions(box){const n=node('div',undefined,'actions');box.append(n);return n}
function field(box,label,value,type='text'){const wrap=node('label',label),input=node('input');input.type=type;if(type==='checkbox')input.checked=value;else input.value=value??'';wrap.append(input);box.append(wrap);return input}
function jsonField(box,label,value){const wrap=node('label',label),input=node('textarea');input.value=JSON.stringify(value,null,2);wrap.append(input);box.append(wrap);return input}
function pretty(box,value){box.append(node('pre',JSON.stringify(value,null,2)))}
async function save(changes){await api('settings',changes);message('Settings saved. The next stage run uses them.');await load()}
function checked(box,label,key,value){const input=field(box,label,value,'checkbox');input.onchange=()=>save({[key]:input.checked}).catch(e=>message(e.message,true));return input}
function frequency(minutes){const unit=minutes>=1440&&minutes%1440===0?'day':minutes>=60&&minutes%60===0?'hour':'minute';const n=minutes/(unit==='day'?1440:unit==='hour'?60:1);return `Every ${n} ${unit}${n===1?'':'s'} (${Number((1440/minutes).toFixed(2))} times a day)`}
async function load(){try{const [s,t]=await Promise.all([api('settings'),api('state')]);config=s.settings;status=t;await render();}catch(e){message(e.message,true)}}
async function render(){if(!pages.includes(page))page='Overview';root.replaceChildren(node('h2',page));document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.textContent===page));
if(page==='Overview'){
 const controls=panel('Pipeline controls');checked(controls,'Pause everything','paused',config.paused);controls.append(node('p',config.paused?'Paused. No stages will start.':'Ready for manual runs. Automatic input stages are still being built.'));
 const grid=node('div',undefined,'grid');root.append(grid);
 for(const [name,s] of Object.entries(status.stages)){const box=panel(name,grid);checked(box,'Enabled',`stages.${name}.enabled`,s.enabled);box.append(node('p',frequency(s.every_minutes)),node('p',s.last?`${s.last.result}: ${s.last.summary}`:'No runs yet'),node('small',`Next due: ${s.next}`));if(s.notice)box.append(node('p',s.notice));actions(box).append(button('Run now',async()=>{await api('run',{stage:name});message(`${name} started. Refresh to see the result.`)}));}
 const counts=panel('Lists and work');pretty(counts,{books:status.books,jobs:status.jobs});
 const todos=panel('Open content requests');todos.append(node('p','Last checked by the requests stage. Run it to refresh.'));for(const kind of ['more_cards','more_practice','problem']){const items=(status.requests||[]).filter(r=>r.kind===kind);todos.append(node('h3',`${kind.replaceAll('_',' ')} (${items.length})`));for(const r of items)todos.append(node('p',`${r.source_id||r.discover_card_id||r.practice_card_id||r.id}: ${r.reason||'Waiting'}`));}
}else if(page==='Schedule'){
 const grid=node('div',undefined,'grid');root.append(grid);
 for(const [name,s] of Object.entries(config.stages)){const box=panel(name,grid),label=node('label','Frequency'),select=node('select');for(const n of [10,15,30,60,120,180,240,360,480,720,1440]){const opt=node('option',frequency(n));opt.value=n;select.append(opt)}select.value=s.every_minutes;label.append(select);box.append(label);const minutes=field(box,'Minutes (or type your own)',s.every_minutes,'number');minutes.min=1;select.onchange=()=>minutes.value=select.value;const start=field(box,'Start hour (inclusive)',s.hours[0],'number'),end=field(box,'End hour (exclusive)',s.hours[1],'number'),max=field(box,'Time limit in minutes',s.max_minutes,'number');const per=s.per_run===undefined?null:field(box,'Items per run',s.per_run,'number');actions(box).append(button('Save schedule',()=>save({[`stages.${name}.every_minutes`]:+minutes.value,[`stages.${name}.hours`]:[+start.value,+end.value],[`stages.${name}.max_minutes`]:+max.value,...(per?{[`stages.${name}.per_run`]:+per.value}:{})}),true));}
 const advanced=node('details');advanced.append(node('summary','All settings'));root.append(advanced);const box=panel('Edit any setting',advanced);box.append(node('p','Enter a dotted path and its JSON value, for example quality.min_pass_rate and 0.6.'));const key=field(box,'Setting path',''),value=jsonField(box,'Value',null);actions(box).append(button('Save setting',()=>save({[key.value]:JSON.parse(value.value)})));pretty(box,config);
}else if(page==='Providers'){
 const grid=node('div',undefined,'grid');root.append(grid);
 const examRoles=['judge','solve','choose','summarize','brief','extract','select','write','quiz'];
 for(const [name,p] of Object.entries(config.providers)){const box=panel(name,grid);box.append(node('p',`${p.driver} · ${status.providers[name].calls_today}/${p.max_calls_per_day??100} calls today`));checked(box,'Enabled',`providers.${name}.enabled`,p.enabled!==false);const model=field(box,'Model',p.model),cap=field(box,'Daily call cap',p.max_calls_per_day??100,'number');if(!p.model)box.append(node('p','Needs a model'));box.append(node('p',`Resting until: ${status.providers[name].resting||'not resting'}`));const q=status.qualified[name]||{},hashes=status.prompt_hashes||{};const list=node('pre',examRoles.map(r=>{const e=q[r];if(!e)return `${r}: none`;const st=e.prompts&&hashes[r]&&e.prompts!==hashes[r]?'old':(e.passed?'passed':'failed');return `${r}: ${st} · ${e.score||''} · ${(e.date||'').slice(0,10)}`}).join('\n'));box.append(list);const a=actions(box);a.append(button('Save',()=>save({[`providers.${name}.model`]:model.value,[`providers.${name}.max_calls_per_day`]:+cap.value})),button('Test',async()=>{await api('provider-test',{provider:name});message('Test started. See Log for its result.')}),button('Run exam',async()=>{await api('run',{command:'eval',provider:name});message('Exam started. Refresh later for its result.')}));}
 const box=panel('Secret availability');pretty(box,(await api('settings')).secrets);
}else if(page==='Roles'){
 for(const [role,names] of Object.entries(config.roles)){const box=panel(role);const list=node('div');box.append(list);function choice(selected=''){const wrap=node('label',`Place ${list.children.length+1}`),sel=node('select');sel.append(node('option',''));for(const name of Object.keys(config.providers)){const qualified=role==='scout'||status.qualified[name]?.[role]?.passed;const opt=node('option',name+(qualified?'':' · no exam'));opt.value=name;if(!qualified)opt.className='subtle';sel.append(opt)}sel.value=selected;wrap.append(sel);list.append(wrap)}names.forEach(choice);actions(box).append(button('Add fallback',()=>choice()),button('Save role',()=>save({[`roles.${role}`]:[...list.querySelectorAll('select')].map(s=>s.value).filter(Boolean)}),true));}
}else if(page==='Books'){
 root.append(node('p','Books you drop into the inbox folder become jobs on the next fetch run.'));const add=panel('Add a book'),title=field(add,'Title',''),author=field(add,'Author (optional)','');actions(add).append(button('Add',async()=>{const res=await api('books',{action:'add',title:title.value,author:author.value});message(`Added: ${res.book.title}`);await load()},true));const books=await api('books');if(!books.length)root.append(node('p','No books on the wish list.'));for(const b of books){const box=panel(b.title);box.append(node('p',`${b.status} · ${b.origin||''} · ${b.last_error||''}`));actions(box).append(button('Skip',async()=>{await api('books',{id:b.id,action:'skip'});await load()}),button('Retry',async()=>{await api('books',{id:b.id,action:'retry'});await load()}));pretty(box,b);}
}else if(page==='Sources'){
 const feeds=await api('feeds');if(!feeds.length)root.append(node('p','No feeds configured.'));
 for(const [i,f] of feeds.entries()){const box=panel(f.reader);box.append(node('p',`${f.today} taken today · ${f.total} in total`));if(f.last_error)box.append(node('p',f.last_error,'error'));const enabled=field(box,'Enabled',f.enabled,'checkbox'),cap=field(box,'Items per day',f.per_day,'number'),topics=field(box,'Topics (comma separated)',f.topics.join(', '));cap.min=0;actions(box).append(button('Save feed',()=>{const updated=config.feeds.map((feed,n)=>n===i?{...feed,enabled:enabled.checked,per_day:+cap.value,topics:topics.value.split(',').map(t=>t.trim()).filter(Boolean)}:feed);return save({feeds:updated})},true));}
 const advanced=node('details');advanced.append(node('summary','Edit feed queries or add a feed'));root.append(advanced);const box=panel('Feed settings',advanced),edit=jsonField(box,'Feeds',config.feeds);actions(box).append(button('Save feeds',()=>save({feeds:JSON.parse(edit.value)}),true));
}else if(page==='Jobs'){
 const jobs=await api('jobs');if(!jobs.length)root.append(node('p','No jobs yet. Add a sample file from the command line.'));for(const j of jobs){const box=panel(j.title||j.id);box.append(node('p',`${j.status} · ${j.step||'not started'} · ${j.error||''}`));actions(box).append(button('View report',async()=>{pretty(box,await api('job?id='+encodeURIComponent(j.id)))}));if(!['done','uploaded'].includes(j.status))actions(box).append(button('Retry',async()=>{await api('job',{id:j.id,action:'retry'});await load()}),button('Drop local job',async()=>{if(confirm('Delete this local job folder?')){await api('job',{id:j.id,action:'drop'});await load()}}));}
}else if(page==='Review'){
 const controls=panel('Publishing');checked(controls,'Publish new sources automatically','publish.auto_publish',config.publish.auto_publish);root.append(node('p','Drafts stay out of the app until you publish them.'));
 const sources=await api('review');if(!sources.length)root.append(node('p','No drafts waiting for review.'));for(const s of sources){const box=panel(s.title);actions(box).append(button('Read cards and tests',async()=>{const r=await api('review?id='+encodeURIComponent(s.id));const detail=node('div');box.append(detail);for(const c of r.cards){const card=panel(c.title,detail);card.append(node('div',c.front,'cardtext'),node('hr'),node('div',c.back,'cardtext'));for(const t of r.tests.filter(t=>(t.practice_links||[]).some(l=>l.discover_card_id===c.id)))pretty(card,t)}if(!r.cards.length)detail.append(node('p','No cards.'));}),button('Publish',async()=>{await api('publish',{id:s.id,status:'published'});message('Source published.');await load()},true),button('Hide',async()=>{await api('publish',{id:s.id,status:'hidden'});await load()}));}
}else if(page==='Usage'){
 const rows=await api('usage');if(!rows.length)root.append(node('p','No model calls in the last 14 days.'));for(const r of rows)pretty(panel(`${r.day} · ${r.provider}`),r);
}else if(page==='Log'){root.append(node('pre',(await api('log')).text));}
}
for(const name of pages){const b=button(name,async()=>{page=name;location.hash=name;message('');await load()});b.setAttribute('role','tab');$('nav').append(b)}
$('#refresh').onclick=load;window.addEventListener('hashchange',()=>{page=location.hash.slice(1);load()});load();
</script>
</html>
