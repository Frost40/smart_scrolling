      <text x="12" y="54" font-size="11" fill="#526775">30-day window</text>
      <text x="12" y="70" font-size="11" fill="#526775">from press</text>
    </g>
    <g transform="translate(348, 6)">
      <rect width="106" height="98" rx="14" fill="#FFFFFF" stroke="#DCE3E6"/>
      <path d="M14 0 H92 A14 14 0 0 1 106 14 V6 H0 V14 A14 14 0 0 1 14 0 Z" fill="#1978A8"/>
      <text x="12" y="34" font-size="12.5" font-weight="700" fill="#172B36">Research</text>
      <text x="12" y="54" font-size="11" fill="#526775">Question →</text>
      <text x="12" y="70" font-size="11" fill="#526775">result &amp; limits</text>
