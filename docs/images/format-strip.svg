      <text x="12" y="70" font-size="11" fill="#526775">Back: fact</text>
    </g>
    <g transform="translate(580, 6)">
      <rect width="106" height="98" rx="14" fill="#FFFFFF" stroke="#DCE3E6"/>
      <path d="M14 0 H92 A14 14 0 0 1 106 14 V6 H0 V14 A14 14 0 0 1 14 0 Z" fill="#2A8C4A"/>
