<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 112" width="920" height="112" role="img" aria-label="Eight Discover card formats and their theme hues">
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
